name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag, for example v0.4.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-stable-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Key07211/daylight'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      DAYLIGHT_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Validate requested release tag
        id: release-input
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:DAYLIGHT_RELEASE_TAG
          if ($tag -cnotmatch '\Av(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)\z') { throw 'Release tag must be an exact stable version such as v0.4.0' }
          $sourceRef = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { "refs/tags/$tag" } else { $env:GITHUB_SHA }
          "source_ref=$sourceRef" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release-input.outputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable source commit
        run: |
          $ErrorActionPreference = 'Stop'
          $tagRef = "refs/tags/$env:DAYLIGHT_RELEASE_TAG"
          $tagCommit = git rev-parse --verify "${tagRef}^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Requested release tag must already exist' }
          $sourceCommit = git rev-parse --verify HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the checked out source commit' }
          if ($sourceCommit -cne $tagCommit) { throw 'Checked out HEAD differs from the requested release tag' }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $sourceCommit -cne $env:GITHUB_SHA) { throw 'Checked out source differs from the tag push commit' }
          "DAYLIGHT_SOURCE_SHA=$sourceCommit" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
      - name: Verify release identity and run tests
        run: |
          node scripts/verify-update-release.mjs --check-tag
          if ($LASTEXITCODE -ne 0) { throw 'Tag and package version must match' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build Windows installer and portable app
        run: |
          npm run package:win -- --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Verify packaged app and installer
        run: |
          node desktop/smoke-packaged.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged app verification failed' }
          node desktop/smoke-portable.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Portable app verification failed' }
          node desktop/verify-installer.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installer payload verification failed' }
          node scripts/verify-update-release.mjs > .runtime/update-release-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Update metadata verification failed' }
          & .\node_modules\.bin\electron.cmd desktop/update-download-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Isolated updater download verification failed' }
      - name: Prepare download bundles and validation records
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $demoStage = Join-Path $env:GITHUB_WORKSPACE '.runtime/demo-release-stage'
          New-Item -ItemType Directory -Path $demoStage | Out-Null
          Copy-Item -LiteralPath README.md,README.zh-CN.md -Destination $demoStage
          Copy-Item -LiteralPath docs -Destination $demoStage -Recurse
          New-Item -ItemType Directory -Path (Join-Path $demoStage 'design') | Out-Null
          Copy-Item -LiteralPath design/day-night-spec.md,design/design-notes.md -Destination (Join-Path $demoStage 'design')
          Compress-Archive -LiteralPath "release/Daylight-Portable-$version.exe" -DestinationPath "release/Daylight-Portable-$version.zip"
          Compress-Archive -Path (Join-Path $demoStage '*') -DestinationPath "release/Daylight-Demo-$version.zip"
          $report = [ordered]@{
            version = $version
            sourceCommit = $env:DAYLIGHT_SOURCE_SHA
            builtAt = [DateTime]::UtcNow.ToString('o')
            platform = 'win32-x64'
            signed = $false
            checks = @('unit-and-integration', 'packaged-app', 'portable-app', 'installer-payload', 'update-metadata', 'isolated-real-update-download')
            update = Get-Content -LiteralPath .runtime/update-release-verification.json -Raw | ConvertFrom-Json
            updateDownload = Get-Content -LiteralPath .runtime/update-download-smoke.json -Raw | ConvertFrom-Json
            packaged = Get-Content -LiteralPath .runtime/desktop-smoke-packaged.json -Raw | ConvertFrom-Json
            portable = Get-Content -LiteralPath .runtime/portable-smoke.json -Raw | ConvertFrom-Json
            installer = Get-Content -LiteralPath .runtime/installer-payload-report.json -Raw | ConvertFrom-Json
          }
          $report | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath "release/VALIDATION-$version.json" -Encoding utf8
          $assets = @(
            "Daylight-Setup-$version.exe",
            "Daylight-Setup-$version.exe.blockmap",
            'latest.yml',
            "Daylight-Portable-$version.exe",
            "Daylight-Portable-$version.zip",
            "Daylight-Demo-$version.zip",
            "VALIDATION-$version.json"
          )
          $checksums = foreach ($name in $assets) {
            $hash = (Get-FileHash -LiteralPath (Join-Path 'release' $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $checksums | Set-Content -LiteralPath "release/SHA256SUMS-$version.txt" -Encoding ascii
          $assets += "SHA256SUMS-$version.txt"
          $assets | ConvertTo-Json | Set-Content -LiteralPath .runtime/release-assets.json -Encoding utf8
          @"
          Daylight $version for Windows x64.

          Download the Setup installer for app updates. The portable edition is updated manually. Versions older than 0.4.0 need one manual installation to enable the updater. These executables are unsigned.

          Windows x64 版本。安装版支持应用内更新，免安装版请手动下载替换。早于 0.4.0 的版本需要先手动安装一次，才能启用自动检查。发行程序尚未签名。

          [English update guide](https://github.com/Key07211/daylight/blob/$env:DAYLIGHT_RELEASE_TAG/docs/UPDATES.md) · [中文更新指南](https://github.com/Key07211/daylight/blob/$env:DAYLIGHT_RELEASE_TAG/docs/UPDATES.zh-CN.md)
          "@ | Set-Content -LiteralPath .runtime/release-notes.md -Encoding utf8
      - name: Upload and verify draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:DAYLIGHT_RELEASE_TAG
          $latestJson = gh api "repos/$env:GH_REPO/releases/latest" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $latestTag = ($latestJson | ConvertFrom-Json).tag_name
            if ($latestTag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Latest public release has an unexpected version format' }
            if ([version]($tag.Substring(1)) -le [version]($latestTag.Substring(1))) { throw 'A stable release must be newer than the latest public version' }
          } else {
            throw 'Could not confirm the latest public release; no draft was changed'
          }
          $existing = gh release view $tag --json isDraft,targetCommitish 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) { throw 'This version is already public. Publish fixes with a new version; existing releases are not overwritten.' }
            if ($release.targetCommitish -ne $env:DAYLIGHT_SOURCE_SHA) { throw 'Existing draft belongs to a different commit.' }
          } else {
            gh release create $tag --verify-tag --draft --target $env:DAYLIGHT_SOURCE_SHA --title "Daylight $tag" --notes-file .runtime/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft' }
          }
          $assetNames = @(Get-Content -LiteralPath .runtime/release-assets.json -Raw | ConvertFrom-Json)
          $assetPaths = @($assetNames | ForEach-Object { Join-Path 'release' $_ })
          gh release upload $tag @assetPaths --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains a draft' }
          $uploadedJson = gh api "repos/$env:GH_REPO/releases/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify uploaded assets; release remains a draft' }
          $uploaded = $uploadedJson | ConvertFrom-Json
          if (-not $uploaded.draft) { throw 'Expected an unpublished draft' }
          if (@($uploaded.assets).Count -ne $assetNames.Count) { throw 'Unexpected release asset count' }
          foreach ($name in $assetNames) {
            $matches = @($uploaded.assets | Where-Object name -CEQ $name)
            if ($matches.Count -ne 1) { throw "Missing or duplicate uploaded asset: $name" }
            $localPath = Join-Path 'release' $name
            $localHash = (Get-FileHash -LiteralPath $localPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($matches[0].size -ne (Get-Item -LiteralPath $localPath).Length -or $matches[0].digest -cne "sha256:$localHash") {
              throw "Uploaded asset failed checksum or size verification: $name"
            }
          }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
