<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Explore Daylight: tasks, themes, reminders, and Codex on Windows.">
<title>Daylight · Product tour</title>
<style>
:root{--paper:#f1f3eb;--ink:#233e35;--soft:#698074;--line:#647f7029;--glass:#ffffff70;--accent:#426e5b;--wash:#e1e9d9;--shadow:#3d605319;--glow:#fbe9b591;color-scheme:light;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-synthesis:none}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:var(--paper);color:var(--ink);line-height:1.6;transition:background .6s,color .4s}body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 17% 10%,var(--glow),transparent 42%),radial-gradient(ellipse at 93% 59%,#a8cfc335,transparent 46%)}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}button:disabled{cursor:default}a{color:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:active{transform:scale(.98)}[hidden]{display:none!important}
html[data-theme=night]{--paper:#111d2a;--ink:#e0eaf3;--soft:#9badbf;--line:#b6cae02c;--glass:#2233488c;--accent:#b8d6ec;--wash:#243951;--shadow:#00000040;--glow:#53669c40;color-scheme:dark}
.shell{max-width:1480px;margin:auto;padding:0 32px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 0;border-bottom:1px solid var(--line)}.wordmark{display:flex;align-items:center;gap:11px;text-decoration:none;font-size:21px;font-weight:650;letter-spacing:-.6px}.brand-icon{display:grid;place-items:center;width:35px;height:35px;border-radius:12px;background:linear-gradient(140deg,#ffffffa8,#d6e3d866);box-shadow:inset 1px 1px 0 #ffffffc9,0 3px 12px var(--shadow);color:#62836b}.brand-icon svg{width:25px;height:25px}.top-right{display:flex;gap:16px;align-items:center}.language{display:flex;padding:3px;border:1px solid var(--line);border-radius:99px;gap:2px;background:var(--glass)}.language button{padding:5px 12px;color:var(--soft);border:0;background:transparent;border-radius:99px;font-size:12px}.language button[aria-pressed=true]{color:var(--ink);background:var(--paper);box-shadow:0 1px 6px var(--shadow)}.tour-button,.opening-controls button{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:99px;background:var(--glass);color:var(--ink);padding:8px 16px;font-size:12px}.tour-button:hover,.opening-controls button:hover{background:var(--wash)}
.workbench{display:grid;grid-template-columns:154px minmax(0,1fr);gap:28px;align-items:start;padding-top:28px}.chapters{position:sticky;top:24px;display:flex;flex-direction:column;gap:8px;padding-top:5px}.chapter{width:100%;display:flex;gap:11px;text-align:left;align-items:center;padding:12px;background:transparent;border:1px solid transparent;border-radius:13px;color:var(--soft);font-size:13px}.chapter b{font-size:10px;font-weight:550;opacity:.6;font-variant-numeric:tabular-nums}.chapter[aria-current=step]{color:var(--ink);background:var(--glass);border-color:var(--line);box-shadow:inset 1px 1px 0 #ffffff7a,0 6px 18px var(--shadow)}.chapter[aria-current=step] b{color:var(--accent);opacity:1}.chapter:hover{background:var(--glass)}
.viewer{min-width:0}.viewer-top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:14px;min-height:35px}.viewer-top h1{font-size:23px;font-weight:550;letter-spacing:-.03em;line-height:1.3;margin:0}.shot-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}.shot-controls button{border:1px solid transparent;background:transparent;color:var(--soft);font-size:11px;border-radius:99px;padding:5px 10px}.shot-controls button[aria-pressed=true]{border-color:var(--line);background:var(--glass);color:var(--ink)}
.screen{position:relative;border-radius:17px;border:1px solid var(--line);padding:5px;background:linear-gradient(145deg,#ffffff9c,#dce7df45);box-shadow:0 23px 58px var(--shadow),inset 0 1px 0 #ffffffb8;overflow:hidden}.screen-image-button{display:block;width:100%;padding:0;border:0;background:var(--paper);border-radius:12px;overflow:hidden;cursor:zoom-in;aspect-ratio:3/2}.screen-image-button img{display:block;width:100%;height:100%;object-fit:contain}.screen-image-button:active{transform:none}.scene-copy{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:16px 0 13px}.scene-copy p{color:var(--soft);font-size:13px;margin:0}.scene-copy button{padding:0;background:none;border:0;color:var(--soft);font-size:11px;white-space:nowrap;text-underline-offset:3px}.scene-copy button:hover{text-decoration:underline}
.chapter-bottom{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);color:var(--soft);font-size:11px}.chapter-bottom button{border:0;background:transparent;color:var(--ink);font-size:12px;padding:7px 0}.chapter-bottom button:disabled{opacity:.35}.special-panel{padding:0 0 16px}.flow-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.flow-card{border:1px solid var(--line);background:var(--glass);border-radius:13px;padding:15px 18px}.flow-card h2{font-size:14px;margin:0 0 5px;font-weight:600}.flow-card p{font-size:12px;color:var(--soft);margin:0}.codex-note{font-size:11px;color:var(--soft);margin:10px 0 0}.opening-controls{display:flex}.closing{display:flex;justify-content:space-between;align-items:center;gap:24px;margin:20px 0 0;padding:20px 0 26px;border-top:1px solid var(--line);font-size:11px;color:var(--soft)}.closing p{margin:0}.closing-links{display:flex;gap:18px;white-space:nowrap}.closing-links a{text-decoration:none}.closing-links a:hover{text-decoration:underline}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
dialog{border:1px solid var(--line);padding:8px;border-radius:18px;width:min(96vw,1600px);max-height:95vh;background:var(--paper);color:var(--ink);box-shadow:0 35px 100px #0005}dialog::backdrop{background:#08151bcc;backdrop-filter:blur(7px)}dialog img{display:block;width:100%;max-height:83vh;object-fit:contain;border-radius:11px}.zoom-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:8px 9px 12px}dialog button{color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-size:12px}.swap{animation:arrive .26s ease-out both}@keyframes arrive{from{opacity:.65;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1050px){.shell{padding:0 24px}.workbench{grid-template-columns:136px minmax(0,1fr);gap:18px}.chapter{font-size:12px;padding:11px 9px}.viewer-top{align-items:flex-start;flex-direction:column;gap:10px}.shot-controls{justify-content:flex-start}}
@media(max-width:700px){.shell{padding:0 16px}.topbar{padding:18px 0;gap:12px}.top-right{gap:8px}.wordmark{font-size:18px;gap:8px}.brand-icon{width:29px;height:29px}.language button{padding:4px 8px;font-size:11px}.tour-button{padding:7px 10px;font-size:11px;gap:6px}.workbench{display:block;padding-top:19px}.chapters{position:static;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:20px;padding:0}.chapter{font-size:11px;padding:10px 7px;gap:6px;white-space:nowrap}.viewer-top h1{font-size:22px}.shot-controls button{font-size:10px;padding:4px 9px}.screen{border-radius:11px;padding:3px}.screen-image-button{border-radius:8px}.scene-copy{gap:12px;padding-top:13px}.scene-copy p{font-size:12px}.scene-copy button{font-size:10px}.flow-grid{grid-template-columns:1fr}.closing{align-items:flex-start;flex-direction:column;gap:10px;padding:18px 0;margin-top:10px}.closing-links{gap:18px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{animation:none!important;transition:none!important}}
@media(forced-colors:active){.screen,.chapter,.flow-card,.tour-button{border:1px solid CanvasText}.brand-icon{box-shadow:none}.chapter[aria-current=step]{outline:1px solid Highlight}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <a class="wordmark" href="#" aria-label="Daylight"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="5.3" fill="currentColor" opacity=".75"/><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M16 3v4m0 18v4M3 16h4m18 0h4M6.8 6.8l2.8 2.8m12.8 12.8 2.8 2.8M6.8 25.2l2.8-2.8M22.4 9.6l2.8-2.8"/></g></svg></span>Daylight</a>
  <div class="top-right"><button class="tour-button" id="auto-tour" aria-pressed="false"><span data-i18n="tourStart">Play tour</span><span aria-hidden="true">↗</span></button><div class="language" role="group" aria-label="Language"><button data-lang="en" aria-pressed="true">English</button><button data-lang="zh" aria-pressed="false">中文</button></div></div>
</header>
<main class="workbench" id="walkthrough">
  <nav class="chapters" aria-label="Product chapters">
    <button class="chapter" data-chapter="tasks" aria-current="step"><b>01</b><span data-i18n="chapterTasks">Tasks</span></button>
    <button class="chapter" data-chapter="atmosphere"><b>02</b><span data-i18n="chapterAtmosphere">Themes</span></button>
    <button class="chapter" data-chapter="desktop"><b>03</b><span data-i18n="chapterDesktop">Desktop</span></button>
    <button class="chapter" data-chapter="codex"><b>04</b><span data-i18n="chapterCodex">Codex</span></button>
    <button class="chapter" data-chapter="opening"><b>05</b><span data-i18n="chapterOpening">Opening</span></button>
    <button class="chapter" data-chapter="local"><b>06</b><span data-i18n="chapterLocal">Local data</span></button>
  </nav>
  <section class="viewer" aria-label="Product preview">
    <div class="viewer-top"><h1 id="scene-title">Tasks & reminders</h1><div class="shot-controls" id="shot-controls" role="group" aria-label="Choose view"></div></div>
    <div class="screen"><button class="screen-image-button" id="zoom-image" aria-label="View larger"><img id="scene-image" src="media/en/tasks-day.webp" alt="Daylight sample tasks" width="1440" height="960" decoding="async"></button></div>
    <div class="scene-copy" id="scene-copy"><p id="scene-description"></p><button id="zoom-link" data-i18n="zoom">View larger ↗</button></div>
    <div class="special-panel" id="special-panel" hidden></div>
    <div class="chapter-bottom"><button id="previous" data-i18n="previous">← Previous</button><span id="chapter-count">01 / 06</span><button id="next" data-i18n="next">Next →</button></div>
  </section>
</main>
<footer class="closing"><p data-i18n="demoNote">Sample preview. No tasks are changed.</p><div class="closing-links"><a href="USER_GUIDE.md" data-i18n="userGuide">User guide ↗</a><a href="MCP_GUIDE.md" data-i18n="mcpGuide">Codex setup ↗</a></div></footer>
</div>
<div id="announcement" class="sr-only" aria-live="polite"></div>
<dialog id="zoom-dialog"><div class="zoom-top"><span id="zoom-title"></span><button id="close-zoom" data-i18n="close">Close</button></div><img id="zoom-content" alt=""></dialog>
<script>
(() => {
'use strict';
if (location.protocol === 'https:' || location.protocol === 'http:') {
  document.querySelectorAll('.closing-links a').forEach(link => {
    link.href = 'https://github.com/Key07211/daylight/blob/main/docs/' + link.getAttribute('href');
  });
}
const strings = {
  tourStart: ['播放导览', 'Play tour'], tourPause: ['暂停导览', 'Pause tour'],
  chapterTasks: ['任务', 'Tasks'], chapterAtmosphere: ['主题', 'Themes'],
  chapterDesktop: ['桌面', 'Desktop'], chapterCodex: ['Codex', 'Codex'],
  chapterOpening: ['开场', 'Opening'], chapterLocal: ['本地数据', 'Local data'],
  demoNote: ['示例预览，不会修改任务。', 'Sample preview. No tasks are changed.'],
  zoom: ['放大查看 ↗', 'View larger ↗'], previous: ['← 上一章', '← Previous'], next: ['下一章 →', 'Next →'],
  close: ['关闭', 'Close'], userGuide: ['使用手册 ↗', 'User guide ↗'], mcpGuide: ['Codex 接入 ↗', 'Codex setup ↗'],
  play: ['播放开场', 'Play opening'], stop: ['停止播放', 'Stop playback'],
  mcpTitle: ['管理任务 · MCP', 'Manage tasks · MCP'],
  mcpBody: ['在 Codex 对话中查看、添加和修改清单。', 'Review, add, and update tasks from a Codex conversation.'],
  scheduleTitle: ['定时执行 · Codex CLI', 'Schedule work · Codex CLI'],
  scheduleBody: ['设置指令、工作目录与执行时间。', 'Choose instructions, a workspace, and a time.'],
  codexNote: ['示例连接未启用，调度已暂停。', 'Disconnected example. Schedule paused.']
};
const shots = {
  'tasks-day': { label: ['日光', 'Daylight'], alt: ['日光界面与示例任务', 'Daylight interface with sample tasks'] },
  'task-editor': { label: ['编辑与提醒', 'Edit & remind'], alt: ['任务编辑与提醒时间', 'Task editor and reminder time'] },
  'complete-confirm': { label: ['完成确认', 'Confirmation'], alt: ['任务完成确认', 'Task completion confirmation'] },
  'tasks-night': { label: ['夜晚', 'Night'], alt: ['月光与星星的夜晚界面', 'Night interface with moonlight and stars'], night: true },
  'tasks-rain': { label: ['雨天', 'Rain'], alt: ['雨天的液态玻璃界面', 'Rain on the liquid-glass interface'] },
  'glass-settings': { label: ['玻璃设置', 'Glass controls'], alt: ['液态玻璃参数设置', 'Liquid-glass settings'] },
  'tasks-english': { label: ['English · 置顶', 'Pinned window'], alt: ['英文界面与窗口置顶', 'English interface with the window pinned'] },
  'codex-workflow': { label: ['调度', 'Scheduling'], alt: ['未连接的 Codex 与暂停的调度', 'Disconnected Codex with a paused schedule'] },
  'opening-day': { label: ['晨光', 'Morning'], alt: ['太阳与向日葵开场', 'Sun and sunflower opening'], movie: true },
  'opening-night': { label: ['月光', 'Moonlight'], alt: ['月亮与悬星开场', 'Moonlight and hanging stars opening'], movie: true, night: true },
  'opening-rain': { label: ['雨窗', 'Rain window'], alt: ['雨窗与微光开场', 'Rain-window opening'], movie: true }
};
const chapters = [
  { id: 'tasks', title: ['任务与提醒', 'Tasks & reminders'], body: ['整理任务、设置提醒，完成前再确认。', 'Organize tasks, set reminders, and confirm completion.'], shots: ['tasks-day', 'task-editor', 'complete-confirm'] },
  { id: 'atmosphere', title: ['日夜与天气', 'Day, night & weather'], body: ['日夜随系统时间切换，玻璃随天气变化。', 'Themes follow your system clock; glass responds to the weather.'], shots: ['tasks-day', 'tasks-night', 'tasks-rain', 'glass-settings'] },
  { id: 'desktop', title: ['桌面功能', 'Desktop essentials'], body: ['窗口置顶、中英文切换与托盘运行。', 'Pin the window, switch languages, or keep it in the tray.'], shots: ['tasks-english', 'tasks-day'] },
  { id: 'codex', title: ['与 Codex 协作', 'Work with Codex'], body: ['对话管理清单，也能定时执行工作。', 'Manage your list in chat, or schedule work.'], shots: ['codex-workflow'], special: 'codex' },
  { id: 'opening', title: ['开场动画', 'Opening moments'], body: ['晨光、月光与雨窗，随时可以跳过。', 'Sunlight, moonlight, or rain. Always skippable.'], shots: ['opening-day', 'opening-night', 'opening-rain'], special: 'opening' },
  { id: 'local', title: ['本地保存', 'Stored locally'], body: ['任务留在本机，可随时导出备份。', 'Keep tasks on your computer and export a backup.'], shots: ['tasks-day'] }
];
let lang = new URLSearchParams(location.search).get('lang') === 'zh' ? 'zh' : 'en';
let chapter = 0, shot = 'tasks-day', playing = false, tour = null, previousFocus = null;
const $ = selector => document.querySelector(selector);
const $$ = selector => [...document.querySelectorAll(selector)];
const tr = value => Array.isArray(value) ? value[lang === 'en' ? 1 : 0] : value;
const t = key => tr(strings[key]);
function element(tag, text, className) { const el = document.createElement(tag); if (text) el.textContent = text; if (className) el.className = className; return el; }
function localize() {
  document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
  document.title = lang === 'en' ? 'Daylight · Product tour' : 'Daylight · 产品演示';
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  $$('[data-lang]').forEach(el => el.setAttribute('aria-pressed', String(el.dataset.lang === lang)));
  $('#auto-tour [data-i18n="tourStart"]').textContent = t(tour ? 'tourPause' : 'tourStart');
  $('#zoom-image').setAttribute('aria-label', t('zoom'));
}
function show(index, nextShot, announce = true) {
  chapter = Math.max(0, Math.min(chapters.length - 1, index));
  const current = chapters[chapter];
  shot = nextShot && current.shots.includes(nextShot) ? nextShot : current.shots[0];
  playing = false; render(announce);
}
function render(announce = true) {
  localize();
  const current = chapters[chapter], capture = shots[shot];
  document.documentElement.dataset.theme = capture.night ? 'night' : 'day';
  $$('[data-chapter]').forEach(button => {
    if (button.dataset.chapter === current.id) button.setAttribute('aria-current', 'step');
    else button.removeAttribute('aria-current');
  });
  $('#scene-title').textContent = tr(current.title);
  $('#scene-description').textContent = tr(current.body);
  $('#scene-image').src = `media/${lang === 'en' ? 'en/' : ''}${shot}${capture.movie && !playing ? '-still' : ''}.webp`;
  $('#scene-image').alt = tr(capture.alt);
  $('#chapter-count').textContent = String(chapter + 1).padStart(2, '0') + ' / 06';
  $('#previous').disabled = chapter === 0; $('#next').disabled = chapter === 5;
  $('#shot-controls').replaceChildren(...current.shots.map(id => {
    const button = element('button', tr(shots[id].label)); button.dataset.shot = id;
    button.setAttribute('aria-pressed', String(id === shot));
    button.addEventListener('click', () => { stopTour(); show(chapter, id); }); return button;
  }));
  renderSpecial(current.special);
  $('#scene-copy').classList.remove('swap'); void $('#scene-copy').offsetWidth; $('#scene-copy').classList.add('swap');
  if (announce) $('#announcement').textContent = tr(current.title);
}
function renderSpecial(kind) {
  const panel = $('#special-panel'); panel.replaceChildren(); panel.hidden = !kind;
  if (kind === 'opening') {
    const box = element('div', null, 'opening-controls'), button = element('button', t(playing ? 'stop' : 'play'));
    button.id = 'play-opening'; button.setAttribute('aria-pressed', String(playing));
    button.addEventListener('click', () => { stopTour(); playing = !playing; render(false); });
    box.append(button); panel.append(box);
  }
  if (kind === 'codex') {
    const grid = element('div', null, 'flow-grid');
    for (const mode of ['mcp', 'schedule']) {
      const card = element('article', null, 'flow-card');
      card.append(element('h2', t(mode + 'Title')), element('p', t(mode + 'Body'))); grid.append(card);
    }
    panel.append(grid, element('p', t('codexNote'), 'codex-note'));
  }
}
function stopTour() { if (tour) clearInterval(tour); tour = null; $('#auto-tour').setAttribute('aria-pressed', 'false'); localize(); }
function zoom() {
  previousFocus = document.activeElement;
  $('#zoom-content').src = $('#scene-image').src; $('#zoom-content').alt = $('#scene-image').alt;
  $('#zoom-title').textContent = tr(shots[shot].label); $('#zoom-dialog').showModal(); $('#close-zoom').focus();
}
$$('[data-lang]').forEach(button => button.addEventListener('click', () => {
  lang = button.dataset.lang; playing = false;
  if (/^https?:$/.test(location.protocol)) {
    const url = new URL(location.href); url.searchParams.set('lang', lang); history.replaceState(null, '', url);
  }
  render(false);
}));
$$('[data-chapter]').forEach(button => button.addEventListener('click', () => { stopTour(); show(chapters.findIndex(item => item.id === button.dataset.chapter)); }));
$('#previous').addEventListener('click', () => { stopTour(); show(chapter - 1); });
$('#next').addEventListener('click', () => { stopTour(); show(chapter + 1); });
$('#zoom-image').addEventListener('click', zoom); $('#zoom-link').addEventListener('click', zoom);
$('#close-zoom').addEventListener('click', () => $('#zoom-dialog').close());
$('#zoom-dialog').addEventListener('close', () => previousFocus?.focus());
$('#zoom-dialog').addEventListener('click', event => { if (event.target === $('#zoom-dialog')) $('#zoom-dialog').close(); });
$('#auto-tour').addEventListener('click', () => {
  if (tour) return stopTour(); show(0); $('#walkthrough').scrollIntoView({ block: 'start' });
  tour = setInterval(() => { if (chapter === 5) return stopTour(); show(chapter + 1); }, 7500);
  $('#auto-tour').setAttribute('aria-pressed', 'true'); localize();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) stopTour(); });
render(false);
})();
</script>
</body>
</html>
